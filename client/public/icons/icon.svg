<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#medGrad)" />
  <!-- Inner White Card -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="#ffffff" fill-opacity="0.95" />
  <!-- Medical Red Cross -->
  <rect x="216" y="116" width="80" height="280" rx="20" fill="url(#crossGrad)" />
  <rect x="116" y="216" width="280" height="80" rx="20" fill="url(#crossGrad)" />
  <!-- Heartbeat pulse overlay -->
  <path d="M 120 256 L 190 256 L 220 180 L 260 330 L 290 220 L 320 256 L 392 256" 
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Signal / Offline wifi indicator -->
  <circle cx="256" cy="410" r="16" fill="#0f766e" />
  <path d="M 216 380 A 56 56 0 0 1 296 380" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" />
  <path d="M 186 350 A 96 96 0 0 1 326 350" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" />
</svg>
